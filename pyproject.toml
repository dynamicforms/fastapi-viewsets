[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamicforms-fastapi-viewsets"
dynamic = ["version"]
description = "Django REST Framework-style viewsets for FastAPI, with optional Celery-backed async execution and a Vue/TypeScript client counterpart."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jure Erznožnik", email = "jure.erznoznik@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["fastapi", "viewsets", "rest", "dynamicforms", "celery", "django-rest-framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.1",
    "typing_extensions>=4.10",
]

[project.optional-dependencies]
celery = ["celery>=5.3", "redis>=5.0"]
muxws = ["muxws[starlette]>=0.3.1"]
django = ["django>=4.2", "asgiref>=3.6"]
jwt = ["PyJWT>=2.8"]
dev = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "redis",
    "celery",
    "django",
    "asgiref",
    "PyJWT",
    "muxws[starlette,websockets]>=0.3.1",
]

[project.urls]
Homepage = "https://github.com/dynamicforms/fastapi-viewsets"
Repository = "https://github.com/dynamicforms/fastapi-viewsets"
Issues = "https://github.com/dynamicforms/fastapi-viewsets/issues"
Documentation = "https://docs.velis.si/dynamicforms/fastapi-viewsets/"

[tool.hatch.version]
path = "fastapi_viewsets/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_viewsets"]

[tool.hatch.build.targets.sdist]
include = [
    "/fastapi_viewsets",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/*_test.py",
]

[tool.ruff]
exclude = ['dockertest',
    'tests', 'docs', 'examples', 'scripts', 'setup.py', 'setup.cfg', 'README.md', 'LICENSE', 'MANIFEST.in',
    'pyproject.toml', 'Pipfile', 'Pipfile.lock', 'ruff.egg-info', 'dist', 'build', '.gitignore', '.git', '.idea',
    '.vscode', '.pytest_cache', '.coverage', '.ruff', '*/migrations/*']
line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E",    # pycodestyle errors (instead of just E4, E7, E9)
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "Q",    # flake8-quotes
    "B",    # flake8-bugbear (finds common logical errors)
    "UP",   # pyupgrade (suggests modern Python syntax)
    "N",    # pep8-naming (checks proper naming of functions/classes)
    "PT",   # flake8-pytest-style (excellent for your pytest tests)
    "S",    # flake8-bandit (basic security checks)
    "C4",   # flake8-comprehensions (better list/dict comprehensions)
    "ARG",  # flake8-unused-arguments (finds unused function arguments)
#    "E4", "E7", "E9", "F", "I", "Q"
]
ignore = ["E731", "E722", "C408"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
omit = ["demo/*", "demo/**/*", "demo.py", "test_*.py", "*_test.py"]
