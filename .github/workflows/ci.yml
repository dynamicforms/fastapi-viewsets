name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev] ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # `npm install`, not `npm ci`: package-lock.json is deliberately not committed, so CI
      # resolves dependencies afresh and tests against current upstream rather than a frozen tree.
      - run: npm install
      # `lint:ci`, not `lint`: the developer script carries `--fix`, which rewrites the violation
      # and exits 0. In CI that rewrite is discarded with the runner, so an auto-fixable violation
      # would be reported by nothing and reach main unnoticed.
      - run: npm run lint:ci
      - run: npm test
      - run: npm run build
      - run: npm run docs:build

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e .[dev]
      - name: Python tests with coverage
        run: |
          coverage run -m pytest
          coverage json

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - name: Vue tests with coverage
        run: npm test

      - name: Incremental coverage check
        uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: |
            coverage.json
            coverage/clover.xml
          # docs/ is the VitePress site and demo/ the sample app - neither is library code, and
          # neither is covered by pytest or vitest, whose coverage is scoped to fastapi_viewsets/
          # and vue/ respectively. vue/index.ts is a re-export barrel excluded from vitest's own
          # coverage config for the same reason.
          extra-ignore-patterns: |
            docs/**
            demo/**
            vue/index.ts
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'pull_request'
