name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    # the RedisEventStore contract in fastapi_viewsets/events/store_test.py runs against this Redis
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FASTAPI_VIEWSETS_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run docs:build

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e .[dev]
      - name: Python tests with coverage
        run: |
          coverage run -m pytest
          coverage json

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - name: Vue tests with coverage
        run: npm test

      - name: Incremental coverage check
        uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: |
            coverage.json
            coverage/clover.xml
          # docs/ is the VitePress site, scripts/ the lint runner and demo.py/demo/ the sample app -
          # none is library code, and none is covered by pytest or vitest, whose coverage is scoped to
          # fastapi_viewsets/ and vue/ respectively (pyproject.toml's own [tool.coverage.run] omits
          # the same paths). vue/index.ts is a re-export barrel excluded from vitest's own coverage
          # config for the same reason.
          extra-ignore-patterns: |
            docs/**
            demo.py
            demo/**
            scripts/**
            vue/index.ts
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'pull_request'
